seed: 17
data:
  type: synthetic
  n_steps: 512
  n_variables: 5
  n_lags: 2
  switch_at: 320
  blend_steps: 0
  sparsity: 0.2
  noise_scale: 0.1
  input_length: 24
  horizon: 6
  train_fraction: 0.45
  validation_fraction: 0.1
  seed: 17
model:
  name: ocg
  state_dim: 8
  n_layers: 1
  embedding_dim: 4
  graph:
    learning_rate: 0.01
    sparsity_weight: 0.001
    temperature: 1.0
    ema_decay: 0.95
    graph_stride: 1
    boost: 3.0
    boost_steps: 20
    detector_decay: 0.95
    detector_threshold: 3.5
    detector_warmup: 30
    detector_min_std: 0.000001
  variants:
    - {id: identity, name: ocg, graph_mode: identity}
    - {id: learned, name: ocg, graph_mode: learned}
    - {id: oracle, name: ocg, graph_mode: oracle}
    - {id: dense, name: ocg, graph_mode: dense}
    - {id: random, name: ocg, graph_mode: random}
    - {id: dlinear, name: dlinear, moving_average: 3}
    - {id: revin_linear, name: revin_linear}
    - {id: transformer_lite, name: transformer_lite, model_dim: 16, n_heads: 2}
    - {id: no_graph_ssm, name: no_graph_ssm}
    - {id: var_direct, name: var_direct}
    - {id: no_direct_lag_head, name: ocg, graph_mode: learned, use_direct_lag_head: false}
    - {id: no_ssm_coupling, name: ocg, graph_mode: learned, use_ssm_coupling: false}
    - {id: no_online_graph_updates, name: ocg, graph_mode: learned, online_graph_updates: false}
    - {id: no_detector_boost, name: ocg, graph_mode: learned, graph: {boost: 1.0}}
training:
  mode: online
  online_start: cold_start
  epochs: 1
  batch_size: 32
  learning_rate: 0.001
