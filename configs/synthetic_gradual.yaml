seed: 23
data:
  type: synthetic
  n_steps: 512
  n_variables: 5
  n_lags: 2
  switch_at: 300
  blend_steps: 80
  sparsity: 0.2
  noise_scale: 0.1
  input_length: 24
  horizon: 6
  train_fraction: 0.45
  validation_fraction: 0.1
  seed: 23
model:
  name: ocg
  graph_mode: learned
  state_dim: 8
  n_layers: 1
  embedding_dim: 4
  graph:
    learning_rate: 0.01
    sparsity_weight: 0.001
    temperature: 1.0
    ema_decay: 0.95
    graph_stride: 1
    boost: 3.0
    boost_steps: 20
    detector_decay: 0.95
    detector_threshold: 3.5
    detector_warmup: 30
    detector_min_std: 0.000001
training:
  mode: online
  epochs: 5
  batch_size: 32
  learning_rate: 0.001
