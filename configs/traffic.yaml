seed: 41
data:
  type: csv
  csv_path: data/traffic.csv
  input_length: 96
  horizon: 24
  train_fraction: 0.7
  validation_fraction: 0.1
  n_lags: 1
model:
  name: ocg
  graph_mode: learned
  state_dim: 16
  n_layers: 1
  embedding_dim: 8
  graph:
    learning_rate: 0.01
    sparsity_weight: 0.001
    temperature: 1.0
    ema_decay: 0.95
    graph_stride: 1
    boost: 3.0
    boost_steps: 20
    detector_decay: 0.95
    detector_threshold: 3.5
    detector_warmup: 30
    detector_min_std: 0.000001
training:
  mode: offline
  epochs: 10
  batch_size: 32
  learning_rate: 0.001
