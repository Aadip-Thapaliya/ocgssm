[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocg"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "torch", "numpy", "scipy", "pandas",
  "scikit-learn", "pyyaml", "matplotlib", "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"