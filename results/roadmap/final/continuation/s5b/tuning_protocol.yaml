mechanism: learned_fast = frozen S5 learned_det_on (ema 0.95, threshold 3.5, boost 5, boost_steps 20, confirm 2, rearm 10, frozen-threshold calibration on tune windows) plus, on each confirmed detection, (i) ema_logits <- current logits (the buffer read by adjacency(use_ema=True), i.e. the graph used by the forecaster), (ii) for the next N structural steps the loss is computed on the most recent B observed input windows (current window included; inputs only, observed before the step; no targets, no future windows). Detector scores remain single-window. Implementation src/ocg/fast_graph.py, tests tests/test_fast_graph.py.
